[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helmdrift"
version = "0.1.0"
description = "What is running in your cluster versus what your Helm chart says, and who changed it."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mohsin Ali" }]
keywords = ["kubernetes", "helm", "drift", "configuration-drift", "devops", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "kubernetes>=31",
  "pyyaml>=6",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
helmdrift = "helmdrift.cli:main"

[project.urls]
Homepage = "https://github.com/mohsinaliwork686-rgb/helmdrift"

[tool.hatch.build.targets.wheel]
packages = ["src/helmdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Said outright, so import sorting is the same everywhere instead of depending on what each
# machine has installed.
known-first-party = ["helmdrift", "tests"]
