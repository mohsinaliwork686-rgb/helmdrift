---
# Source: shop/templates/web.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: shop
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shop-0.1.0
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: shop
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: shop
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: shop
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          env:
            - name: APP_MODE
              value: "production"
            - name: LOG_FORMAT
              value: json
          envFrom:
            - configMapRef:
                name: shop-config
          resources:
            limits:
              cpu: 0.5
              memory: 128Mi
            requests:
              cpu: 0.1
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http

---
# Source: shop/templates/worker.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-worker
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: shop
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shop-0.1.0
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: shop
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: shop
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: shop
      containers:
        - name: worker
          image: busybox:1.37
          command: ["sh", "-c", "while true; do sleep 30; done"]
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-credentials
                  key: password
          resources:
            requests: {cpu: 50m, memory: 16Mi}
---
# Source: shop/templates/worker.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shop-worker
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: shop
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: shop-0.1.0
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shop-worker
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80


